<div class="figure">
    <div class="figure__controls">
        <div class="control">
            <label class="control__label" for="arrow-graph-select">Metric</label>
            <div class="select-wrap">
                <select id="arrow-graph-select">
                    <option value="ratings-brewery">Ratings of brewery locations</option>
                    <option value="popularity-brewery">Popularity of brewery locations</option>
                </select>
            </div>
        </div>
    </div>
    <div class="figure__body">
        <div id="arrow-graph"></div>
    </div>
    <div class="figure__footer">
        <div class="control control--slider">
            <label class="control__label" for="arrow-graph-year-slider">Year</label>
            <span id="arrow-graph-year" class="year-readout">2006</span>
            <input id="arrow-graph-year-slider" class="range" type="range" min="2006" max="2017" value="2006" step="1" />
        </div>
    </div>
</div>
<script src="{{ '/assets/js/plots/arrow-graph.js?v=' | append: site.github.build_revision | relative_url }}" type="module"></script>
