<div class="figure">
    <div class="figure__controls">
        <div class="control">
            <label class="control__label" for="trends-map-select">Metric</label>
            <div class="select-wrap">
                <select id="trends-map-select">
                    <option value="ratings-style">Ratings of beer styles</option>
                    <option value="popularity-style">Popularity of beer styles</option>
                    <option value="ratings-brewery">Ratings of brewery locations</option>
                    <option value="popularity-brewery">Popularity of brewery locations</option>
                </select>
            </div>
        </div>
    </div>
    <div class="figure__body">
        <div id="trends-map"></div>
    </div>
    <div class="figure__footer">
        <div class="control control--slider">
            <label class="control__label" for="map-year-slider">Year</label>
            <span id="map-year" class="year-readout">2006</span>
            <input id="map-year-slider" class="range" type="range" min="2006" max="2017" value="2006" step="1" />
        </div>
    </div>
</div>
<div id="map-tooltip" class="chart-tooltip"></div>
<script src="{{ '/assets/js/plots/trends-maps.js?v=' | append: site.github.build_revision | relative_url }}" type="module"></script>
