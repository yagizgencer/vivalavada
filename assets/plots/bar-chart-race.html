<div class="figure">
    <div class="figure__controls">
        <div class="control">
            <label class="control__label" for="bar-race-select">Metric</label>
            <div class="select-wrap">
                <select id="bar-race-select">
                    <option value="ratings-style">Ratings of beer styles</option>
                    <option value="number-ratings-style">Popularity of beer styles</option>
                    <option value="ratings-brewery">Ratings of brewery locations</option>
                    <option value="number-ratings-brewery">Popularity of brewery locations</option>
                </select>
            </div>
        </div>
    </div>
    <div class="figure__body">
        <div id="bar-race"></div>
    </div>
    <div class="figure__footer">
        <div class="button-group">
            <button id="bar-race-pause-button" class="btn-control" type="button">⏸️ Pause the race</button>
            <button id="bar-race-restart-button" class="btn-control btn-control--primary" type="button">🏁 Restart the race</button>
        </div>
    </div>
</div>
<script src="{{ '/assets/js/plots/bar-chart-race.js?v=' | append: site.github.build_revision | relative_url }}" type="module"></script>
